<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Export Color System - Mevivu</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Inter, system-ui, sans-serif;
      background: #fff;
    }

    .wrapper {
      max-width: 460px;
      margin: auto;
    }

    h3 {
      text-align: center;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      background: #e0e0e0;
    }

    button.active {
      background: #02BAD3;
      color: white;
    }

    textarea {
      width: 100%;
      height: 360px;
      resize: none;
      padding: 10px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      white-space: pre;
    }

    .mode-wrapper {
      display: flex;
      gap: 24px;
      padding: 18px 0;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .actions {
      margin-top: 10px;
    }

    .actions button {
      background: #02BAD3;
      color: white;
      width: 100%;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <h3>Export Color System</h3>

    <div class="tabs">
      <button id="mobile" class="active">Mobile (Flutter)</button>
      <button id="web">Web (CSS)</button>
    </div>

    <textarea id="output" spellcheck="false"></textarea>

    <div class="mode-wrapper">

      <label class="form-check">
        <input type="radio" name="mode" value="light" checked>
        Light Mode
      </label>

      <label class="form-check">
        <input type="radio" name="mode" value="dark">
        Dark Mode
      </label>

    </div>

    <div class="actions">
      <button id="copy">Copy</button>
    </div>

    <p class="footer">©2026 Dinh Trong Phuc All Rights Reserved</p>

  </div>

  <script>

    let currentPlatform = "mobile"
    let currentMode = "light"
    let cache = { light: "", dark: "" }

    const textarea = document.getElementById("output")

    const mobileBtn = document.getElementById("mobile")
    const webBtn = document.getElementById("web")

    const radios = document.querySelectorAll('input[name="mode"]')

    function setPlatform(btn, type) {

      mobileBtn.classList.remove("active")
      webBtn.classList.remove("active")

      btn.classList.add("active")

      currentPlatform = type

      parent.postMessage({ pluginMessage: { type: type } }, "*")

    }

    mobileBtn.onclick = () => setPlatform(mobileBtn, "mobile")
    webBtn.onclick = () => setPlatform(webBtn, "web")

    /* MODE CHANGE */

    radios.forEach(radio => {

      radio.addEventListener("change", () => {

        currentMode = radio.value
        textarea.value = cache[currentMode] || ""

      })

    })

    /* RECEIVE MESSAGE */

    onmessage = (event) => {

      cache = event.data.pluginMessage

      textarea.value = cache[currentMode] || ""

    }

    /* COPY */

    document.getElementById("copy").onclick = () => {

      textarea.select()
      document.execCommand("copy")

    }

    /* DEFAULT LOAD */

    mobileBtn.click()

  </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Export Color System - Mevivu</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Inter, system-ui, sans-serif;
      background: #ffffff;
      color: #000000;
    }

    .wrapper {
      max-width: 460px;
      margin: auto;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      text-align: center;
    }

    .format-select {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: #e0e0e0;
    }

    button.active {
      background: #02BAD3;
      color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 380px;
      resize: none;
      padding: 10px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      white-space: pre;
    }

    .actions {
      margin-top: 10px;
    }

    .actions button {
      background: #02BAD3;
      color: white;
      width: 100%;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <h3>Export Color System</h3>

    <div class="format-select">
      <button id="mobile" class="active">Mobile (Flutter)</button>
      <button id="web">Web (CSS)</button>
    </div>

    <textarea id="output" spellcheck="false"></textarea>
    <div class="actions">
      <button id="copy">Copy</button>
    </div>

    <p class="footer">©2026 Dinh Trong Phuc All Rights Reserved</p>

  </div>

  <script>
    const textarea = document.getElementById('output');
    const mobileBtn = document.getElementById('mobile');
    const webBtn = document.getElementById('web');

    function setActive(btn) {
      mobileBtn.classList.remove('active');
      webBtn.classList.remove('active');
      btn.classList.add('active');
    }

    mobileBtn.onclick = () => {
      setActive(mobileBtn);
      parent.postMessage({ pluginMessage: { type: 'mobile' } }, '*');
    };

    webBtn.onclick = () => {
      setActive(webBtn);
      parent.postMessage({ pluginMessage: { type: 'web' } }, '*');
    };

    onmessage = (event) => {
      textarea.value = event.data.pluginMessage || '';
    };

    document.getElementById('copy').onclick = () => {
      textarea.select();
      document.execCommand('copy');
    };

    // default load
    mobileBtn.click();
  </script>

</body>

</html>
